function timer(){const now=new Date(),parts=vancouverParts(now),hour=Number(parts.hour)%24,minute=Number(parts.minute),day={Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6}[parts.weekday];let state='before',target;if(day===4){state='open';target=vancouverBoundary(parts,0,1);}else if(day===5&&hour<17){state='open';target=vancouverBoundary(parts,17,0);}else if(day===5&&hour>=17){state='closed';target=now;}else{state='before';target=vancouverBoundary(parts,0,(4-day+7)%7||7);}if(state==='closed')return {label:'Delivery window closed',tone:'red',closed:true,now:fmtTime(now)};const ms=Math.max(0,target-now),totalSeconds=Math.floor(ms/1000),h=Math.floor(totalSeconds/3600),m=Math.floor(totalSeconds%3600/60),s=totalSeconds%60,d=Math.floor(h/24),clock=`${d}d ${String(h%24).padStart(2,'0')}h ${String(m).padStart(2,'0')}m ${String(s).padStart(2,'0')}s`,label=state==='before'?`Starts in ${clock}`:`${clock} remaining`,tone=state==='before'?'blue':h<1?'red':h<6?'orange':h<24?'yellow':'blue';return {label,tone,closed:false,now:fmtTime(now)};}
function routeAddresses(){const list=[...data.addresses],order=data.session.order||'Original Order';if(order==='Original Order')return list;const distance=a=>{const match=a.label.match(/^(\d+)/);return match?Math.abs(Number(match[1])-825):9999};return list.sort((a,b)=>order==='Nearest → Farthest'?distance(a)-distance(b):distance(b)-distance(a));}
function layout(){if(portal==='landing')return portalScreen();const c=counts();document.getElementById('app').innerHTML=`<div class="app"><aside class="sidebar"><div class="brand">FLYER<span>TRACK</span></div><div><div class="eyebrow">Carrier portal</div><nav class="nav">${[['route','Route'],['addresses','Addresses'],['history','History'],['stats','Stats'],['settings','Settings']].map(([id,label])=>`<button class="${data.view===id?'active':''}" onclick="go('${id}')">${label}</button>`).join('')}</nav></div><div class="side-foot">Offline-first workspace<br><span id="syncLabel">Saved on this device</span></div></aside><main class="main"><header class="topbar"><div><div class="eyebrow">Delivery control room</div><h1>${data.view==='route'?'Today\'s route':data.view[0].toUpperCase()+data.view.slice(1)}</h1></div><div class="mode"><span class="pill">Carrier: ${esc(user()?.name||'Unassigned')}</span><span class="sync-status" id="syncStatus">${syncState.time?`${syncState.label} · ${syncState.time}`:syncState.label}</span><button class="btn primary small" onclick="syncNow()">Sync Now</button><button class="btn secondary small" onclick="portalHome()">Portal home</button></div></header><section class="page">${data.view==='route'?routeView(c):data.view==='addresses'?addressesView():data.view==='history'?historyView():data.view==='stats'?statsView():settingsView()}</section></main></div>`;}
function portalScreen(){document.getElementById('app').innerHTML=`<main class="portal-gate"><div class="gate-brand">FLYER<span>TRACK</span></div><p class="eyebrow">Delivery control room</p><h1>Choose your portal</h1><p class="gate-copy">Track every doorstep clearly, even when you are offline.</p><div class="portal-options"><button class="portal-card carrier-card" onclick="carrierLogin()"><strong>Carrier portal</strong><span>Deliver, revisit, add notes, manage users</span></button><button class="portal-card employer-card" onclick="portalEmployerLogin()"><strong>Employer portal</strong><span>View the latest read-only delivery report</span></button></div></main>`;}
function carrierLogin(){openModal('Carrier portal',`<p class="sub">Enter your carrier passcode to continue.</p><label class="form-grid"><span>Passcode<input class="field" id="carrierPasscode" type="password" inputmode="numeric"></span></label><div class="actions" style="margin-top:18px"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="checkCarrier()">Enter carrier portal</button></div>`)}
function checkCarrier(){if(document.getElementById('carrierPasscode').value!=='2010')return toast('Incorrect carrier passcode');portal='carrier';sessionStorage.setItem('flyertrack-portal',portal);closeModal();chooseWeek();}
function chooseWeek(){const years=Array.from({length:11},(_,i)=>2026+i),months=['January','February','March','April','May','June','July','August','September','October','November','December'];openModal('Choose delivery week',`<p class="sub">Select the year, month, and delivery week for this route.</p><div class="form-grid"><label>Year<select class="field" id="deliveryYear">${years.map(year=>`<option>${year}</option>`).join('')}</select></label><label>Month<select class="field" id="deliveryMonth">${months.map(month=>`<option>${month}</option>`).join('')}</select></label><label class="full">Week<select class="field" id="deliveryWeek">${[1,2,3,4,5].map(week=>`<option>Week ${week}</option>`).join('')}</select></label></div><div class="actions" style="margin-top:18px"><button class="btn primary" onclick="confirmWeek()">Continue to carrier portal</button></div>`)}
function confirmWeek(){data.session.year=document.getElementById('deliveryYear').value;data.session.month=document.getElementById('deliveryMonth').value;data.session.week=document.getElementById('deliveryWeek').value;data.session.label=`${data.session.month} ${data.session.year} · ${data.session.week}`;save();closeModal();layout();}
function routeView(c){const pct=c.total?Math.round(c.delivered/c.total*100):0,queue=routeAddresses();let next=queue.findIndex((a,i)=>i>=data.lastAddress&&a.status!=='delivered');if(next<0)next=queue.findIndex(a=>a.status!=='delivered');const a=queue[next];data.lastAddress=next;const t=timer();return `<div class="notice ${t.closed?'warn':''}"><span><strong>${t.closed?'Delivery window closed.':'Session ready.'}</strong> Changes save automatically for offline use.</span><span class="badge">${data.session.order}</span></div><div class="grid metrics"><div class="panel metric"><div class="eyebrow">Delivered</div><strong>${c.delivered} <small>/ ${c.total}</small></strong><small>${pct}% complete</small></div><div class="panel metric"><div class="eyebrow">Revisit</div><strong>${c.revisit}</strong><small>needs another pass</small></div><div class="panel metric"><div class="eyebrow">Remaining</div><strong>${c.total-c.delivered}</strong><small>unique homes</small></div><div class="panel metric"><div class="eyebrow">Time remaining</div><div class="timer ${t.tone}">${t.label}</div><small>Now ${t.now} Vancouver · Thu 12:00 AM to Fri 5:00 PM</small></div></div><div class="grid layout"><div class="panel"><div class="section-head"><h2>Weekly progress</h2><button class="btn ghost small" onclick="startSession()">Set route order</button></div><div class="progress"><i style="width:${pct}%"></i></div><div class="statline"><span>${c.delivered} delivered</span><span>${c.revisit} revisit</span><span>${c.total-c.delivered} remaining</span></div><div class="section-head" style="margin-top:28px"><h2>Address queue</h2><button class="btn secondary small" onclick="go('addresses')">View all</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Address</th><th>Status</th><th>Action</th></tr></thead><tbody>${queue.slice(Math.max(0,next-2),next+5).map(addressRow).join('')}</tbody></table></div></div><div class="panel next"><div class="eyebrow">Next delivery</div><div class="next-address">${a?esc(a.label):'All addresses delivered'}</div>${a?`<div class="sub">Queue position ${next+1} of ${c.total}</div><div class="actions" style="margin-top:18px"><button class="btn secondary" onclick="navigate('${a.id}')">Navigate</button><button class="btn primary" onclick="mark('${a.id}','delivered')">Delivered</button><button class="btn warn" onclick="mark('${a.id}','revisit')">Revisit</button></div>`:''}</div></div>`;}
function addressRow(a){return `<tr><td><div class="address">${esc(a.label)}</div>${a.note?`<div class="sub">Note: ${esc(a.note)}</div>`:''}</td><td><span class="status ${a.status}"><i class="dot"></i>${a.status==='delivered'?'Delivered':a.status==='revisit'?'Revisit':'Not delivered'}</span></td><td><div class="actions"><button class="btn primary small" onclick="mark('${a.id}','delivered')">Delivered</button><button class="btn warn small" onclick="mark('${a.id}','revisit')">Revisit</button><button class="btn ghost small" onclick="editAddress('${a.id}')">Note</button></div></td></tr>`;}
function addressesView(){return `<div class="panel"><div class="section-head"><h2>Address book <span class="sub">${data.addresses.length} records</span></h2><button class="btn primary" onclick="addAddress()">+ Add address</button></div><div class="filterbar"><input class="field" id="addressSearch" placeholder="Search addresses" oninput="renderAddressTable()"><select class="field" id="statusFilter" onchange="renderAddressTable()"><option value="all">All statuses</option><option value="remaining">Not delivered</option><option value="revisit">Revisit</option><option value="delivered">Delivered</option></select></div><div id="addressTable"></div></div>`}
function renderAddressTable(){const q=(document.getElementById('addressSearch')?.value||'').toLowerCase(),f=document.getElementById('statusFilter')?.value||'all';const list=data.addresses.filter(a=>(f==='all'||a.status===f)&&a.label.toLowerCase().includes(q));document.getElementById('addressTable').innerHTML=list.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Address</th><th>Status</th><th>Last activity</th><th>Actions</th></tr></thead><tbody>${list.map(a=>`<tr><td><div class="address">${esc(a.label)}</div>${a.note?`<div class="sub">${esc(a.note)}</div>`:''}</td><td><span class="status ${a.status}"><i class="dot"></i>${a.status==='delivered'?'Delivered':a.status==='revisit'?'Revisit':'Not delivered'}</span></td><td class="sub">${a.events.length?fmtDate(a.events[a.events.length-1].at):'—'}</td><td><div class="actions"><button class="btn primary small" onclick="mark('${a.id}','delivered')">Delivered</button><button class="btn warn small" onclick="mark('${a.id}','revisit')">Revisit</button><button class="btn ghost small" onclick="editAddress('${a.id}')">Edit</button></div></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No addresses match this filter.</div>';}
function historyView(){const events=data.addresses.flatMap(a=>a.events.map(e=>({...e,address:a.label}))).sort((a,b)=>new Date(b.at)-new Date(a.at));return `<div class="panel"><div class="section-head"><h2>Permanent history</h2><button class="btn secondary small" onclick="downloadCSV()">Export CSV</button></div><div class="timeline">${events.length?events.map(e=>`<div class="event"><strong>${e.action==='delivered'?'Delivered':'Revisit'} · ${esc(e.address)}</strong><time>${fmtDate(e.at)} · ${esc(e.userName)} · ${esc(e.weekLabel||'Week not selected')}</time></div>`).join(''):'<div class="empty">Delivery events will appear here.</div>'}</div></div>`}
function statsView(){const c=counts(),pct=c.total?Math.round(c.delivered/c.total*100):0;return `<div class="grid metrics"><div class="panel metric"><div class="eyebrow">Completion</div><strong>${pct}%</strong><small>${c.delivered} of ${c.total} unique addresses</small></div><div class="panel metric"><div class="eyebrow">Delivered</div><strong>${c.delivered}</strong><small>completed homes</small></div><div class="panel metric"><div class="eyebrow">Revisit events</div><strong>${data.addresses.reduce((n,a)=>n+a.events.filter(e=>e.action==='revisit').length,0)}</strong><small>all-time in this workspace</small></div><div class="panel metric"><div class="eyebrow">Active users</div><strong>${data.users.filter(u=>u.active).length}</strong><small>carrier profiles</small></div></div><div class="panel"><div class="section-head"><h2>Progress breakdown</h2></div><div class="progress"><i style="width:${pct}%"></i></div><div class="statline"><span>Delivered ${c.delivered}</span><span>Revisit ${c.revisit}</span><span>Remaining ${c.total-c.delivered}</span></div></div>`}
function settingsView(){return `<div class="grid layout"><div class="panel"><div class="section-head"><h2>Users</h2><button class="btn primary" onclick="addUser()">+ Add user</button></div>${data.users.map(u=>`<div class="section-head" style="border-bottom:1px solid var(--line);padding:10px 0"><span><strong>${esc(u.name)}</strong><span class="sub"> ${esc(u.id)}</span></span><button class="btn ${data.currentUser===u.id?'secondary':'ghost'} small" onclick="switchUser('${u.id}')">${data.currentUser===u.id?'Current':'Switch'}</button></div>`).join('')}</div><div class="panel"><div class="section-head"><h2>Data controls</h2></div><p class="sub">Your tracker is saved in this browser and remains available after closing the tab.</p><div class="actions"><button class="btn secondary" onclick="downloadCSV()">Download CSV</button><button class="btn secondary" onclick="printReport()">Export PDF</button><button class="btn ghost" onclick="backup()">Backup JSON</button><button class="btn ghost" onclick="restore()">Restore JSON</button></div><hr style="border:0;border-top:1px solid var(--line);margin:22px 0"><button class="btn danger" onclick="resetData()">Reset workspace</button></div></div>`}
function go(view){data.view=view;save();layout();if(view==='addresses')renderAddressTable();}
function mark(id,action){if(action==='delivered'){activeDeliveryId=id;return deliverFlow(id);}const a=data.addresses.find(x=>x.id===id);if(!a)return;const priorStatus=a.status,event={action,at:new Date().toISOString(),year:data.session.year||'',month:data.session.month||'',week:data.session.week||'',weekLabel:data.session.label||'',sessionKey:sessionKey(),userId:user().id,userName:user().name,addressSnapshot:a.label};a.events.push(event);save();layout();toast('Revisit recorded');}
async function deliverFlow(id){const a=data.addresses.find(x=>x.id===id),active=data.users.filter(u=>u.active);if(!a)return;openModal('Capture delivery',`<p class="sub">Select the delivery user, capture a photo, then save the delivery.</p><div class="form-grid"><label class="full">Delivered by<select class="field" id="deliveryUser">${active.map(u=>`<option value="${esc(u.id)}" ${u.id===data.currentUser?'selected':''}>${esc(u.name)} · ${esc(u.id)}</option>`).join('')}</select></label><div class="full camera-box"><video id="cameraPreview" autoplay playsinline></video><canvas id="cameraCanvas" class="hidden"></canvas><div class="actions"><button class="btn primary" id="captureButton" onclick="capturePhoto()" disabled>Capture photo</button></div><small id="cameraStatus" class="sub">Starting camera…</small><img id="capturedPhoto" class="hidden camera-photo" alt="Captured delivery proof"></div></div><div class="actions" style="margin-top:18px"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn secondary" onclick="confirmDelivery('${id}')">Save without photo</button><button class="btn primary" onclick="confirmDelivery('${id}')">Save delivered</button></div>`);try{await startCamera();}catch{}}
async function startCamera(){try{cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});const video=document.getElementById('cameraPreview');video.srcObject=cameraStream;document.getElementById('captureButton').disabled=false;document.getElementById('cameraStatus').textContent='Camera ready. Frame the delivered flyer and capture it.';}catch{document.getElementById('cameraStatus').textContent='Camera permission was not available. You can still save without a photo.';}}
function capturePhoto(){const video=document.getElementById('cameraPreview'),canvas=document.getElementById('cameraCanvas');if(!video.videoWidth)return;canvas.width=video.videoWidth;canvas.height=video.videoHeight;canvas.getContext('2d').drawImage(video,0,0);const image=canvas.toDataURL('image/jpeg',.82);document.getElementById('capturedPhoto').src=image;document.getElementById('capturedPhoto').classList.remove('hidden');document.getElementById('cameraStatus').textContent='Photo captured. Saving as delivered…';document.getElementById('captureButton').disabled=true;confirmDelivery(activeDeliveryId,image);}
function confirmDelivery(id){const a=data.addresses.find(x=>x.id===id),selected=document.getElementById('deliveryUser');if(!a||!selected)return;const selectedUser=data.users.find(u=>u.id===selected.value)||user(),image=document.getElementById('capturedPhoto')?.src||'';const priorStatus=a.status,event={action:'delivered',at:new Date().toISOString(),year:data.session.year||'',month:data.session.month||'',week:data.session.week||'',weekLabel:data.session.label||'',userId:selectedUser.id,userName:selectedUser.name,addressSnapshot:a.label,image:image.startsWith('data:')?image:''};a.status='delivered';a.events.push(event);data.currentUser=selectedUser.id;data.lastAddress=routeAddresses().findIndex(x=>x.id===id)+1;data.undo={id,priorStatus,eventAt:event.at};save();closeModal();layout();stopCamera();toast('Delivered and timestamped',undoLast);}
function stopCamera(){if(cameraStream){cameraStream.getTracks().forEach(track=>track.stop());cameraStream=null;}}
function undoLast(){if(!data.undo)return;const a=data.addresses.find(x=>x.id===data.undo.id);if(!a)return;a.status=data.undo.priorStatus;a.events=a.events.filter(e=>e.at!==data.undo.eventAt);data.undo=null;save();layout();toast('Delivery undone');}
function editAddress(id){const a=data.addresses.find(x=>x.id===id);openModal('Edit address',`<div class="form-grid"><label class="full">Address<input class="field" id="editLabel" value="${esc(a.label)}"></label><label class="full">Optional note<textarea class="field" id="editNote" rows="4">${esc(a.note)}</textarea></label></div><div class="actions" style="margin-top:18px"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveAddress('${id}')">Save changes</button></div>`)}
function saveAddress(id){const a=data.addresses.find(x=>x.id===id);a.label=document.getElementById('editLabel').value.trim()||a.label;a.note=document.getElementById('editNote').value.trim();save();closeModal();layout();if(data.view==='addresses')renderAddressTable();}
function addAddress(){openModal('Add address',`<div class="form-grid"><label class="full">Street address<input class="field" id="newAddress" placeholder="825 Cook St Unit 4"></label></div><div class="actions" style="margin-top:18px"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveNewAddress()">Add address</button></div>`)}
function saveNewAddress(){const label=document.getElementById('newAddress').value.trim();if(!label)return;if(data.addresses.some(a=>a.label.toLowerCase()===label.toLowerCase())&&!confirm('This address already exists. Add it as a separate record?'))return;data.addresses.push({id:'a'+Date.now(),label,status:'remaining',note:'',events:[]});save();closeModal();layout();renderAddressTable();}
function addUser(){openModal('Add delivery user',`<div class="form-grid"><label>Name<input class="field" id="userName" placeholder="Alex"></label><label>Unique ID<input class="field" id="userId" placeholder="ALEX01"></label></div><div class="actions" style="margin-top:18px"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveUser()">Add user</button></div>`)}
function saveUser(){const name=document.getElementById('userName').value.trim(),id=document.getElementById('userId').value.trim().toUpperCase();if(!name||!id||data.users.some(u=>u.id===id))return toast('Name and a unique ID are required');data.users.push({name,id,active:true});data.currentUser=id;save();closeModal();layout();}
function switchUser(id){data.currentUser=id;save();layout();}
function startSession(){openModal('Choose route order',`<div class="form-grid"><label class="full">Starting order<select class="field" id="routeOrder"><option>Original Order</option><option>Nearest → Farthest</option><option>Farthest → Nearest</option></select></label><p class="sub full">Starting point: 825 Cook St, Victoria, BC V8V 3Z1. Sorting is an address-number estimate and does not use GPS.</p></div><div class="actions" style="margin-top:18px"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveSession()">Start delivery</button></div>`)}
function saveSession(){data.session={...data.session,startedAt:new Date().toISOString(),order:document.getElementById('routeOrder').value};save();closeModal();layout();toast('Delivery session started');}
function navigate(id){const a=data.addresses.find(x=>x.id===id);openModal('Route preview',`<div class="notice"><strong>Destination</strong><span>${esc(a.label)}</span></div><div class="panel" style="box-shadow:none;background:#f4f7f8"><div class="eyebrow">Manual navigation</div><h3 style="margin:8px 0">825 Cook St → ${esc(a.label)}</h3><p class="sub">No GPS tracking is active. Use the destination preview, then record arrival manually.</p></div><div class="actions" style="margin-top:18px"><button class="btn ghost" onclick="closeModal()">Close</button><button class="btn primary" onclick="closeModal();toast('Arrived at destination')">Arrived</button></div>`)}
function portalEmployerLogin(){openModal('Employer portal',`<p class="sub">Enter the employer passcode to view the read-only report.</p><label class="form-grid"><span>Passcode<input class="field" id="passcode" type="password" inputmode="numeric" placeholder="Enter passcode"></span></label><div class="actions" style="margin-top:18px"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="checkEmployer()">View report</button></div>`)}
function checkEmployer(){if(document.getElementById('passcode').value!=='2014')return toast('Incorrect employer passcode');portal='employer';sessionStorage.setItem('flyertrack-portal',portal);closeModal();employerView();}
function employerView(){const c=counts(),pct=c.total?Math.round(c.delivered/c.total*100):0;document.getElementById('app').innerHTML=`<main><header class="topbar"><div><div class="eyebrow">FlyerTrack report</div><h1>Employer dashboard</h1></div><div class="mode"><span class="pill">Read-only</span><button class="btn secondary small" onclick="portalHome()">Portal home</button></div></header><section class="page"><div class="notice"><strong>Employer view — read only</strong><span>Latest records saved on this device</span></div><div class="grid metrics"><div class="panel metric"><div class="eyebrow">Total</div><strong>${c.total}</strong><small>addresses</small></div><div class="panel metric"><div class="eyebrow">Delivered</div><strong>${c.delivered}</strong><small>${pct}% complete</small></div><div class="panel metric"><div class="eyebrow">Revisit</div><strong>${c.revisit}</strong><small>needs another pass</small></div><div class="panel metric"><div class="eyebrow">Remaining</div><strong>${c.total-c.delivered}</strong><small>not completed</small></div></div><div class="panel"><div class="section-head"><h2>Delivery report</h2><div class="actions"><button class="btn secondary small" onclick="downloadCSV()">Download CSV</button><button class="btn secondary small" onclick="printReport()">Export PDF</button></div></div><div class="filterbar"><input class="field" id="employerSearch" placeholder="Search report" oninput="renderEmployerTable()"></div><div id="employerTable"></div></div></section></main>`;renderEmployerTable();}
function renderEmployerTable(){const q=(document.getElementById('employerSearch')?.value||'').toLowerCase(),list=data.addresses.filter(a=>a.label.toLowerCase().includes(q));document.getElementById('employerTable').innerHTML=`<div class="table-wrap"><table class="table"><thead><tr><th>Address</th><th>Status</th><th>Date / time</th><th>User</th></tr></thead><tbody>${list.map(a=>{const e=a.events.filter(x=>x.action==='delivered').slice(-1)[0];return `<tr><td class="address">${esc(a.label)}</td><td><span class="status ${a.status}"><i class="dot"></i>${a.status==='delivered'?'Delivered':a.status==='revisit'?'Revisit':'Not delivered'}</span></td><td class="sub">${e?fmtDate(e.at):'—'}</td><td class="sub">${e?esc(e.userName):'—'}</td></tr>`}).join('')}</tbody></table></div>`;}
function downloadCSV(){const rows=[['Address','Status','DateTime','User','Year','Month','Week','Note','Photo'],...data.addresses.map(a=>{const e=a.events.filter(x=>x.action==='delivered').slice(-1)[0];return [a.label,a.status==='delivered'?'Delivered':a.status==='revisit'?'Revisit':'Not delivered',e?fmtDate(e.at):'',e?e.userName:'',e?.year||'',e?.month||'',e?.week||'',a.note,e?.image?'Captured':'' ]})];const csv=rows.map(r=>r.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(',')).join('\n');download(new Blob([csv],{type:'text/csv'}),'flyer-report.csv');}
function printReport(){const rows=data.addresses.map(a=>{const e=a.events.filter(x=>x.action==='delivered').slice(-1)[0],status=a.status==='delivered'?'Delivered':a.status==='revisit'?'Revisit':'Not delivered';return `<tr><td>${esc(a.label)}</td><td>${status}</td><td>${e?fmtDate(e.at):'—'}</td><td>${e?esc(e.userName):'—'}</td><td>${esc(e?.weekLabel||'—')}</td><td>${esc(a.note||'')}</td><td>${e?.image?'Yes':'No'}</td></tr>`}).join(''),c=counts(),win=window.open('','_blank','noopener,noreferrer');if(!win)return toast('Allow pop-ups to export the PDF');win.document.write(`<html><head><title>FlyerTrack delivery report</title><style>body{font:12px Arial;color:#182536;padding:28px}h1{margin:0 0 6px}p{color:#566575}table{width:100%;border-collapse:collapse;margin-top:22px}th,td{text-align:left;padding:8px;border-bottom:1px solid #d9e1e8}th{background:#eef3f6}</style></head><body><h1>FlyerTrack delivery report</h1><p>Week: ${esc(data.session.label||'Not selected')} · Generated: ${esc(fmtDate(new Date().toISOString()))}</p><p>Total: ${c.total} · Delivered: ${c.delivered} · Revisit: ${c.revisit} · Remaining: ${c.total-c.delivered}</p><table><thead><tr><th>Address</th><th>Status</th><th>Date / time</th><th>User</th><th>Selected week</th><th>Note</th><th>Photo</th></tr></thead><tbody>${rows}</tbody></table></body></html>`);win.document.close();win.focus();setTimeout(()=>win.print(),250);}
function backup(){download(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),'flyertrack-backup.json');}

function historyView(){const events=data.addresses.flatMap(address=>address.events.map(event=>({...event,address:address.label}))).sort((a,b)=>new Date(b.at)-new Date(a.at));return `<div class="panel"><div class="section-head"><h2>Permanent history</h2><button class="btn secondary small" onclick="downloadCSV()">Export CSV</button></div><div class="timeline">${events.length?events.map(event=>`<div class="event"><strong>${event.action==='delivered'?'Delivered':'Revisit'} · ${esc(event.address)}</strong><time>${fmtDate(event.at)} · ${esc(event.userName)} · ${esc(event.weekLabel||'Week not selected')}</time>${event.image?`<img class="history-photo" src="${event.image}" alt="Delivery photo">`:''}</div>`).join(''):'<div class="empty">Delivery events will appear here.</div>'}</div></div>`;}
function renderAddressTable(){const q=(document.getElementById('addressSearch')?.value||'').toLowerCase(),filter=document.getElementById('statusFilter')?.value||'all',list=data.addresses.filter(address=>(filter==='all'||activeStatus(address)===filter)&&address.label.toLowerCase().includes(q));document.getElementById('addressTable').innerHTML=list.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Address</th><th>Status</th><th>Photo</th><th>Last activity</th><th>Actions</th></tr></thead><tbody>${list.map(address=>{const status=activeStatus(address),event=address.events.filter(item=>eventSessionKey(item)===sessionKey()).slice(-1)[0],photo=photoFor(address);return `<tr><td><div class="address">${esc(address.label)}</div>${address.note?`<div class="sub">${esc(address.note)}</div>`:''}</td><td><span class="status ${status}"><i class="dot"></i>${status==='delivered'?'Delivered':status==='revisit'?'Revisit':'Not delivered'}</span></td><td>${photo?`<img class="address-photo" src="${photo}" alt="Delivery photo">`:'—'}</td><td class="sub">${event?fmtDate(event.at):'—'}</td><td><div class="actions"><button class="btn primary small" onclick="mark('${address.id}','delivered')">Delivered</button><button class="btn warn small" onclick="mark('${address.id}','revisit')">Revisit</button><button class="btn ghost small" onclick="editAddress('${address.id}')">Edit</button></div></td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">No addresses match this filter.</div>';}
function downloadCSV(){const years=Array.from({length:11},(_,i)=>2026+i),months=['January','February','March','April','May','June','July','August','September','October','November','December'];openModal('Export report',`<p class="sub">Choose the exact period. The CSV includes the delivery photo data for that period.</p><div class="form-grid"><label>Year<select class="field" id="exportYear">${years.map(year=>`<option>${year}</option>`).join('')}</select></label><label>Month<select class="field" id="exportMonth">${months.map(month=>`<option>${month}</option>`).join('')}</select></label><label class="full">Week<select class="field" id="exportWeek">${[1,2,3,4,5].map(week=>`<option>Week ${week}</option>`).join('')}</select></label></div><div class="actions" style="margin-top:18px"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="exportSelectedCSV()">Fetch and download CSV</button></div>`);}
function exportSelectedCSV(){const selectedKey=`${document.getElementById('exportYear').value}-${document.getElementById('exportMonth').value}-${document.getElementById('exportWeek').value}`,rows=[['Address','Status','DateTime','User','Year','Month','Week','Note','Photo'],...data.addresses.map(address=>{const event=address.events.filter(item=>eventSessionKey(item)===selectedKey).slice(-1)[0],status=event?.action==='delivered'?'Delivered':event?.action==='revisit'?'Revisit':'Not delivered';return [address.label,status,event?fmtDate(event.at):'',event?.userName||'',event?.year||selectedKey.split('-')[0],event?.month||selectedKey.split('-')[1],event?.week||selectedKey.split('-')[2],address.note,event?.image||''];})];const csv=rows.map(row=>row.map(value=>'"'+String(value).replaceAll('"','""')+'"').join(',')).join('\n');download(new Blob([csv],{type:'text/csv'}),`flyer-report-${selectedKey.replaceAll(' ','-')}.csv`);closeModal();}
window.addEventListener('online',incrementalSync);
</script>
